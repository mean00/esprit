[package]
name = "rs_gpio_rp2xxx"
version = "0.1.0"
edition = "2024"

# Pure-Rust GPIO for the RP2040 / RP2350: the `rs_mcu_traits::gpio::Gpio` super
# trait implemented straight on SIO / IO_BANK0 / PADS_BANK0 (registers.rs), the
# RP2xxx counterpart of esprit/rust/rs_mcus/bluepill/rs_gpio_bluepill — pin type, mode
# mapping, open-drain sequencing and the registers, all in one place.
#
# `Pin` is *the* pin type of the RP2xxx Rust stack: `rust_esprit` re-exports it as
# its `Pin`, and the RP2xxx C bindings use it as their `lnPin`.
#
# It exports no C ABI on purpose: on RP2xxx esprit's C++ GPIO
# (esprit/mcus/rp_common/src/ln_rp_gpio.cpp) is still linked and owns the
# lnDigitalWrite/lnPinMode/... symbols, so aliasing them here would be a
# duplicate definition. The mode mapping below mirrors that C++ file bit for bit.

[features]
# Chip address map (CMake: USE_RP2040 / USE_RP2350, forwarded by rust_esprit). The
# SIO / IO_BANK0 / PADS_BANK0 bases come from rs_rp2xxx's root re-export, so exactly
# one of these must be set; `rp2350` wins when both are (rust_esprit's `rp2350`
# implies its `rp2040` — see rs_rp2xxx/src/lib.rs).
default = ["rp2040"]
rp2040 = ["rs_rp2xxx/rp2040"]
rp2350 = ["rs_rp2xxx/rp2350"]

[dependencies]
rs_mcu_traits = { path = "../../traits" }
rs_rp2xxx = { path = "../rs_rp2xxx" }
