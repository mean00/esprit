[package]
name = "rs_spi_rp2xxx"
version = "0.1.0"
edition = "2024"

[features]
# Chip address map (CMake: USE_RP2040 / USE_RP2350, forwarded by rust_esprit).
# `SPI0_BASE` / `SPI1_BASE` differ between the chips (RP2040 `0x4003_c000` /
# `0x4004_0000`, RP2350 `0x4008_0000` / `0x4008_8000`), so exactly one of these
# must be set; it is forwarded to every base-owning dependency. `rp2350` wins when
# both are set (rust_esprit's `rp2350` implies its `rp2040`).
default = ["rp2040"]
rp2040 = [
    "rs_rp2xxx/rp2040",
    "rs_gpio_rp2xxx/rp2040",
    "rs_dma_rp2xxx/rp2040",
    "rs_rcu_rp2xxx/rp2040",
]
rp2350 = [
    "rs_rp2xxx/rp2350",
    "rs_gpio_rp2xxx/rp2350",
    "rs_dma_rp2xxx/rp2350",
    "rs_rcu_rp2xxx/rp2350",
]

[dependencies]
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
rs_rtos = { path = "../../../rs_rtos" }
rs_mcu_traits = { path = "../../traits" }
rs_dma_rp2xxx = { path = "../rs_dma_rp2xxx" }
rs_gpio_rp2xxx = { path = "../rs_gpio_rp2xxx" }
rs_rcu_rp2xxx = { path = "../rs_rcu_rp2xxx" }
rs_rp2xxx = { path = "../rs_rp2xxx" }
