[package]
name = "rs_dma_rp2xxx"
version = "0.1.0"
edition = "2024"

[features]
# Chip address map (CMake: USE_RP2040 / USE_RP2350, forwarded by rust_esprit). The
# DMA channel/global block offsets are the same on both chips, but `RESETS_BASE`
# (and the reset bit layout) are not, so exactly one of these must be set;
# `rp2350` wins when both are (rust_esprit's `rp2350` implies its `rp2040`).
default = ["rp2040"]
rp2040 = ["rs_rp2xxx/rp2040"]
rp2350 = ["rs_rp2xxx/rp2350"]

[dependencies]
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
rs_mcu_traits = { path = "../../traits" }
rs_rtos = { path = "../../../rs_rtos" }
rs_rp2xxx = { path = "../rs_rp2xxx" }
