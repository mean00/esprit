[package] 
authors = ["mean00 <mean00@gmail.com>"]
readme = "README.md"
name = "rust_esprit"
version = "0.0.0"
edition = "2024"

[dependencies]
# --- Platform backends -------------------------------------------------------
# Only one family is selected, by the cargo features below:
#   * `bluepill` — GD32 / CH32: the pure-Rust backends in esprit/rust/bluepill/
#   * `rp2040`   — RP2040 / RP2350: the stubs in esprit/rust/rp2xxx/ (the C++
#                  bridges for timer/multi-pulse/ADC/I2C are not built there)
# See esprit/rust/rp2xxx/README.md.
rs_spi_bluepill = { path = "../bluepill/rs_spi_bluepill", optional = true }
rs_i2c_bluepill = { path = "../bluepill/rs_i2c_bluepill", optional = true }
cty = "0.2.2"
rs_rcu_bluepill = { path = "../bluepill/rs_rcu_bluepill", optional = true }
rs_gpio_bluepill = { path = "../bluepill/rs_gpio_bluepill", optional = true }
rs_exti_bluepill = { path = "../bluepill/rs_exti_bluepill", optional = true }
rs_timer_bluepill = { path = "../bluepill/rs_timer_bluepill", optional = true }
rs_adc_bluepill = { path = "../bluepill/rs_adc_bluepill", optional = true }
rs_multi_pulse_bluepill = { path = "../bluepill/rs_multi_pulse_bluepill", optional = true }
rs_uart_bluepill = { path = "../bluepill/rs_uart_bluepill", optional = true }
rs_pinout48_bluepill = { path = "../bluepill/rs_pinout48_bluepill", optional = true }
rs_spi_wrapped = { path = "../wrapped/rs_spi_wrapped", optional = true }
rs_i2c_wrapped = { path = "../wrapped/rs_i2c_wrapped", optional = true }
rs_timer_wrapped = { path = "../wrapped/rs_timer_wrapped", optional = true }
rs_gpio_wrapped = { path = "../wrapped/rs_gpio_wrapped", optional = true }
rs_exti_wrapped = { path = "../wrapped/rs_exti_wrapped", optional = true }
rs_uart_wrapped = { path = "../wrapped/rs_uart_wrapped", optional = true }
rs_adc_wrapped = { path = "../wrapped/rs_adc_wrapped", optional = true }
rs_spi_rp2xxx = { path = "../rp2xxx/rs_spi_rp2xxx", optional = true }
rs_i2c_rp2xxx = { path = "../rp2xxx/rs_i2c_rp2xxx", optional = true }
rs_timer_rp2xxx = { path = "../rp2xxx/rs_timer_rp2xxx", optional = true }
rs_adc_rp2xxx = { path = "../rp2xxx/rs_adc_rp2xxx", optional = true }
rs_multi_pulse_rp2xxx = { path = "../rp2xxx/rs_multi_pulse_rp2xxx", optional = true }
ufmt = { version = "0.2.0", default-features = false }
heapless = { version = "0.7.17", features = ["ufmt-impl"] }
cfg-if = "1.0"
embedded-hal = { version = "1.0", optional = true }
rs_esprit = { path = "../rs_esprit" }
rs_rtos = { path = "../rs_rtos" }

[features]
cdc = []
embedded-hal = ["dep:embedded-hal"]

# GD32 / CH32 (Bluepill): enables the pure-Rust peripheral backends.
# This is the default so that plain `cargo build` / `cargo clippy` and the
# demo projects keep their historical behaviour; builds that must *not* pull
# the Bluepill backends (RP2040/RP2350, driven by swindle/rs/CMakeLists.txt)
# depend on this crate with `default-features = false`.
bluepill = [
    "dep:rs_spi_bluepill",
    "dep:rs_i2c_bluepill",
    "dep:rs_rcu_bluepill",
    "dep:rs_gpio_bluepill",
    "dep:rs_exti_bluepill",
    "dep:rs_timer_bluepill",
    "dep:rs_adc_bluepill",
    "dep:rs_multi_pulse_bluepill",
    "dep:rs_uart_bluepill",
]
# Package of the bluepill compatible chip (CMake: USE_48PIN_PACKAGE / USE_64PIN_PACKAGE).
# One of them is mandatory with `bluepill`; they select the pin/function mapping
# in rs_pinout48_bluepill.
bluepill48 = ["bluepill", "dep:rs_pinout48_bluepill", "rs_pinout48_bluepill/bluepill48", "rs_timer_bluepill?/bluepill48"]
bluepill64 = ["bluepill", "dep:rs_pinout48_bluepill", "rs_pinout48_bluepill/bluepill64", "rs_timer_bluepill?/bluepill64"]

# RP2040: the C++ bridges for timer / multi-pulse / timing-ADC / I2C are not
# built on RP2xxx (esprit/rust/CMakeLists.txt), so those modules are backed by
# the panicking stubs in esprit/rust/rp2xxx/ instead.
rp2040 = [
    "dep:rs_spi_rp2xxx",
    "dep:rs_i2c_rp2xxx",
    "dep:rs_timer_rp2xxx",
    "dep:rs_adc_rp2xxx",
    "dep:rs_multi_pulse_rp2xxx",
]
# RP2350 shares the complete RP2xxx code path (bindings, cfgs and stubs).
rp2350 = ["rp2040"]

esp32 = [
    "dep:rs_spi_wrapped",
    "dep:rs_i2c_wrapped",
    "dep:rs_timer_wrapped",
    "dep:rs_gpio_wrapped",
    "dep:rs_exti_wrapped",
    "dep:rs_uart_wrapped",
    "dep:rs_adc_wrapped",
]
wrapped = [
    "dep:rs_spi_wrapped",
    "dep:rs_i2c_wrapped",
    "dep:rs_timer_wrapped",
    "dep:rs_gpio_wrapped",
    "dep:rs_exti_wrapped",
    "dep:rs_uart_wrapped",
    "dep:rs_adc_wrapped",
]

default = ["bluepill"]

# esprit provides its own std-compatible shim (FreeRTOS-backed).
# Removes #![no_std] and re-exports FreeRTOS-backed implementations
# under a `std` namespace so that embedded crates depending on `std`
# can compile on the embedded target.
fake_std = []

# esprit is used inside an existing std-enabled framework.
# The framework provides the real `std`; esprit just removes #![no_std].
external_std = []

[lib]
name = "rust_esprit"
path = "src/lib.rs"
crate-type = ["rlib"] # Creates static lib
