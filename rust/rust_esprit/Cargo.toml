[package] 
authors = ["mean00 <mean00@gmail.com>"]
readme = "README.md"
name = "rust_esprit"
version = "0.0.0"
edition = "2024"

[dependencies]

critical-section = "1.2"
# --- Platform backends -------------------------------------------------------
# Only one family is selected, by the cargo features below:
#   * `bluepill` — GD32 / CH32: the pure-Rust backends in esprit/rust/rs_mcus/bluepill/
#   * `rp2040`   — RP2040 / RP2350: the backends in esprit/rust/rs_mcus/rp2xxx/ (the C++
#                  bridges for timer/multi-pulse/I2C are not built there; the ADC is the
#                  pure-Rust rs_adc_rp2xxx driver)
# See esprit/rust/rs_mcus/rp2xxx/README.md.
rs_spi_bluepill = { path = "../rs_mcus/bluepill/rs_spi_bluepill", optional = true }
rs_i2c_bluepill = { path = "../rs_mcus/bluepill/rs_i2c_bluepill", optional = true }
cty = "0.2.2"
rs_rcu_bluepill = { path = "../rs_mcus/bluepill/rs_rcu_bluepill", optional = true }
rs_gpio_bluepill = { path = "../rs_mcus/bluepill/rs_gpio_bluepill", optional = true }
rs_exti_bluepill = { path = "../rs_mcus/bluepill/rs_exti_bluepill", optional = true }
rs_timer_bluepill = { path = "../rs_mcus/bluepill/rs_timer_bluepill", optional = true }
rs_adc_bluepill = { path = "../rs_mcus/bluepill/rs_adc_bluepill", optional = true }
rs_multi_pulse_bluepill = { path = "../rs_mcus/bluepill/rs_multi_pulse_bluepill", optional = true }
rs_uart_bluepill = { path = "../rs_mcus/bluepill/rs_uart_bluepill", optional = true }
rs_dma_bluepill = { path = "../rs_mcus/bluepill/rs_dma_bluepill", optional = true }
rs_afio_bluepill = { path = "../rs_mcus/bluepill/rs_afio_bluepill", optional = true }
rs_pinout48_bluepill = { path = "../rs_mcus/bluepill/rs_pinout48_bluepill", optional = true }
rs_spi_wrapped = { path = "../wrapped/rs_spi_wrapped", optional = true }
rs_i2c_wrapped = { path = "../wrapped/rs_i2c_wrapped", optional = true }
rs_timer_wrapped = { path = "../wrapped/rs_timer_wrapped", optional = true }
rs_gpio_wrapped = { path = "../wrapped/rs_gpio_wrapped", optional = true }
rs_exti_wrapped = { path = "../wrapped/rs_exti_wrapped", optional = true }
rs_uart_wrapped = { path = "../wrapped/rs_uart_wrapped", optional = true }
rs_adc_wrapped = { path = "../wrapped/rs_adc_wrapped", optional = true }
rs_rcu_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_rcu_rp2xxx", optional = true }
rs_exti_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_exti_rp2xxx", optional = true }
rs_uart_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_uart_rp2xxx", optional = true }
rs_spi_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_spi_rp2xxx", optional = true }
rs_dma_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_dma_rp2xxx", optional = true }
rs_i2c_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_i2c_rp2xxx", optional = true }
rs_timer_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_timer_rp2xxx", optional = true }
rs_adc_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_adc_rp2xxx", optional = true }
rs_multi_pulse_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_multi_pulse_rp2xxx", optional = true }
# Real driver (not a stub): pure-Rust GPIO on SIO/IO_BANK0/PADS_BANK0, i.e. the
# `rs_mcu_traits::gpio::Gpio` trait for the RP2xxx pins. Its `Pin` is re-exported
# below as `rust_esprit::gpio_rp2xxx` and used as the `lnPin` of the C bindings.
rs_gpio_rp2xxx = { path = "../rs_mcus/rp2xxx/rs_gpio_rp2xxx", optional = true }
ufmt = { version = "0.2.0", default-features = false }
cfg-if = "1.0"
rs_mcu_traits = { path = "../rs_mcus/traits" }
rs_rtos = { path = "../rs_rtos" }
rs_tinyusb = { path = "../rs_tinyusb", optional = true }

[features]
cdc = ["dep:rs_tinyusb"]

# GD32 / CH32 (Bluepill): enables the pure-Rust peripheral backends.
# This is the default so that plain `cargo build` / `cargo clippy` and the
# demo projects keep their historical behaviour; builds that must *not* pull
# the Bluepill backends (RP2040/RP2350, driven by swindle/rs/CMakeLists.txt)
# depend on this crate with `default-features = false`.
bluepill = [
    "dep:rs_spi_bluepill",
    "dep:rs_i2c_bluepill",
    "dep:rs_rcu_bluepill",
    "dep:rs_gpio_bluepill",
    "dep:rs_exti_bluepill",
    "dep:rs_timer_bluepill",
    "dep:rs_adc_bluepill",
    "dep:rs_multi_pulse_bluepill",
    "dep:rs_uart_bluepill",
    "dep:rs_dma_bluepill",
    "dep:rs_afio_bluepill",
]
# Package of the bluepill compatible chip (CMake: USE_48PIN_PACKAGE / USE_64PIN_PACKAGE).
# One of them is mandatory with `bluepill`; they select the pin/function mapping
# in rs_pinout48_bluepill.
bluepill48 = ["bluepill", "dep:rs_pinout48_bluepill", "rs_pinout48_bluepill/bluepill48", "rs_timer_bluepill?/bluepill48"]
bluepill64 = ["bluepill", "dep:rs_pinout48_bluepill", "rs_pinout48_bluepill/bluepill64", "rs_timer_bluepill?/bluepill64"]

# CH32V3 (CMake: USE_CH32V3x): the chip-level selector on top of `bluepill`. It
# reaches the crates that hold family-specific values through `rs_rcu_bluepill`,
# which forwards it to `rs_bluepill`, so the addresses and the RCU bits can never
# disagree. Without it those crates use the ARM (STM32F1 / GD32F30x) map.
ch32v3x = ["rs_rcu_bluepill/ch32v3x"]

# RP2040: the C++ bridges for timer / multi-pulse / I2C are not built on RP2xxx
# (esprit/rust/CMakeLists.txt), so those modules are backed by the panicking stubs
# in esprit/rust/rs_mcus/rp2xxx/. The ADC has its own driver there
# (rs_adc_rp2xxx), with no C ABI in between.
#
# The chip address map is forwarded to every backend that owns bases: RP2040 and
# RP2350 place IO_BANK0 / PADS_BANK0, SPI, RESETS and CLOCKS at different
# addresses, and the `rs_*_rp2xxx` crates take them from `rs_rp2xxx`'s root
# re-export (esprit/rust/rs_mcus/rp2xxx/README.md).
rp2040 = [
    "dep:rs_rcu_rp2xxx",
    "dep:rs_spi_rp2xxx",
    "dep:rs_dma_rp2xxx",
    "dep:rs_i2c_rp2xxx",
    "dep:rs_timer_rp2xxx",
    "dep:rs_adc_rp2xxx",
    "dep:rs_multi_pulse_rp2xxx",
    "dep:rs_gpio_rp2xxx",
    "dep:rs_uart_rp2xxx",
    "dep:rs_exti_rp2xxx",
    "rs_rcu_rp2xxx/rp2040",
    "rs_spi_rp2xxx/rp2040",
    "rs_dma_rp2xxx/rp2040",
    "rs_gpio_rp2xxx/rp2040",
    "rs_adc_rp2xxx/rp2040",
    "rs_exti_rp2xxx/rp2040",
]
# RP2350 shares the complete RP2xxx code path (bindings, cfgs and stubs) and adds
# its own address map. `rp2040` stays enabled because it is the "this is an
# RP2xxx" selector every `#[cfg(feature = "rp2040")]` in this crate tests; the
# backends resolve the pair as "rp2350 wins".
rp2350 = [
    "rp2040",
    "rs_rcu_rp2xxx/rp2350",
    "rs_spi_rp2xxx/rp2350",
    "rs_dma_rp2xxx/rp2350",
    "rs_gpio_rp2xxx/rp2350",
    "rs_adc_rp2xxx/rp2350",
    "rs_uart_rp2xxx/rp2350",
    "rs_exti_rp2xxx/rp2350",
]

esp32 = [
    "rs_rtos/esp32",
    "dep:rs_spi_wrapped",
    "dep:rs_i2c_wrapped",
    "dep:rs_timer_wrapped",
    "dep:rs_gpio_wrapped",
    "dep:rs_exti_wrapped",
    "dep:rs_uart_wrapped",
    "dep:rs_adc_wrapped",
]
wrapped = [
    "dep:rs_spi_wrapped",
    "dep:rs_i2c_wrapped",
    "dep:rs_timer_wrapped",
    "dep:rs_gpio_wrapped",
    "dep:rs_exti_wrapped",
    "dep:rs_uart_wrapped",
    "dep:rs_adc_wrapped",
]

# The Esprit logger (`lnDebug.cpp`) written in Rust: CMake option
# USE_RUST_LOGGER, which drops lnDebug.cpp from ln_utils and defines the same
# C ABI here (logger_c.rs).  Needs the Bluepill UART/DMA backends, and a nightly
# compiler (c_variadic).
rust_logger = ["bluepill"]
# Which UART the logger writes to when nothing is redirected (CMake
# LN_DEBUG_UART, C++ `LN_DEBUG_UART`): the default is instance 0 / USART0.
logger_uart1 = []
logger_uart2 = []

default = ["bluepill"]

# esprit provides its own std-compatible shim (FreeRTOS-backed).
# Removes #![no_std] and re-exports FreeRTOS-backed implementations
# under a `std` namespace so that embedded crates depending on `std`
# can compile on the embedded target.
fake_std = []

# esprit is used inside an existing std-enabled framework.
# The framework provides the real `std`; esprit just removes #![no_std].
external_std = []

[lib]
name = "rust_esprit"
path = "src/lib.rs"
crate-type = ["rlib"] # Creates static lib
