[package] 
authors = ["mean00 <mean00@gmail.com>"]
readme = "README.md"
name = "rust_esprit"
version = "0.0.0"
edition = "2024"

[dependencies]
rs_spi_bluepill = { path = "../bluepill/rs_spi_bluepill" }
rs_i2c_bluepill = { path = "../bluepill/rs_i2c_bluepill" }
cty = "0.2.2"
rs_rcu_bluepill = { path = "../bluepill/rs_rcu_bluepill" }
rs_gpio_bluepill = { path = "../bluepill/rs_gpio_bluepill" }
rs_exti_bluepill = { path = "../bluepill/rs_exti_bluepill" }
rs_timer_bluepill = { path = "../bluepill/rs_timer_bluepill" }
rs_adc_bluepill = { path = "../bluepill/rs_adc_bluepill" }
rs_multi_pulse_bluepill = { path = "../bluepill/rs_multi_pulse_bluepill" }
rs_uart_bluepill = { path = "../bluepill/rs_uart_bluepill" }
ufmt = { version = "0.2.0", default-features = false }
heapless = { version = "0.7.17", features = ["ufmt-impl"] }
cfg-if = "1.0"
embedded-hal = { version = "1.0", optional = true }

[features]
cdc = []
embedded-hal = ["dep:embedded-hal"]
rp2040 = []
esp32 = []
default = []

# esprit provides its own std-compatible shim (FreeRTOS-backed).
# Removes #![no_std] and re-exports FreeRTOS-backed implementations
# under a `std` namespace so that embedded crates depending on `std`
# can compile on the embedded target.
fake_std = []

# esprit is used inside an existing std-enabled framework.
# The framework provides the real `std`; esprit just removes #![no_std].
external_std = []

[lib]
name = "rust_esprit"
path = "src/lib.rs"
crate-type = ["rlib"] # Creates static lib
